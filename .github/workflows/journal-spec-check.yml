name: Journal Spec URL Health Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-journal-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repository integrity tests
        run: python -m unittest discover -s tests
      - name: Check journal author guide URLs
        run: python scripts/check_journal_urls.py
      - name: Save detailed URL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-url-report
          path: journal-url-report.md
          if-no-files-found: warn
